# smashboard — __DOMAIN_NAME__
# Rails/Puma behind nginx. Personal dashboard: one user, no crawlers wanted.

limit_req_zone $binary_remote_addr zone=smashboard_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=smashboard_assets:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=smashboard_perip:10m;

upstream smashboard_backend {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMAIN_NAME__;

    access_log off;
    error_log /var/log/nginx/smashboard-error.log warn;

    # Left reachable over plain HTTP so certbot can renew without a config swap.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN_NAME__;

    access_log /var/log/nginx/smashboard-access.log combined;
    error_log /var/log/nginx/smashboard-error.log warn;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_NAME__/privkey.pem;

    # Inline rather than including certbot's options-ssl-nginx.conf, which
    # collides with any ssl_dhparam another site on the same box has already set.
    ssl_session_cache shared:smashboard_ssl:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

    limit_conn smashboard_perip 20;

    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    # Camera snapshots stream back through Rails; nothing is uploaded.
    client_max_body_size 2M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* /(wp-admin|wp-login|wp-content|wordpress|xmlrpc\.php|phpmyadmin|pma) {
        return 444;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        return 444;
    }

    location ~* (\.bak|\.backup|\.old|\.env|\.git|\.svn|\.sql)$ {
        return 444;
    }

    # ─── ActionCable ─────────────────────────────────────────────────────
    # Panels refreshed by the jobs process broadcast their new tile over this
    # socket, so it has to hold open far longer than a normal request.
    location /cable {
        proxy_pass http://smashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ─── Digest-stamped assets ───────────────────────────────────────────
    # Served straight off disk. Rails never sees these requests.
    location /assets/ {
        limit_req zone=smashboard_assets burst=60 nodelay;
        alias /home/__PI_USER__/smashboard/app/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── PWA ─────────────────────────────────────────────────────────────
    # The service worker must never be cached: a stale one keeps an old push
    # handler alive past a deploy.
    location = /service-worker {
        proxy_pass http://smashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest {
        proxy_pass http://smashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # Every icon the manifest names, straight off disk.
    location ~ ^/(icon[a-z0-9-]*\.(png|svg)|favicon\.ico)$ {
        root /home/__PI_USER__/smashboard/app/public;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ─── Health check ────────────────────────────────────────────────────
    location = /up {
        proxy_pass http://smashboard_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── Everything else ─────────────────────────────────────────────────
    location / {
        limit_req zone=smashboard_general burst=40 nodelay;
        proxy_pass http://smashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Generous: a dashboard render can wait on a slow panel.
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
